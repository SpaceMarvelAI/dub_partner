# This is meant for local development only. Do not use this in production.
services:
  ps-mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: planetscale
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    command:
      [
        # ponytail: 1000 connections + default buffer pool is server-grade
        # sizing on a laptop. Local dev never has more than a handful of
        # connections; raise these back if you add load testing.
        "--max_connections=50",
        "--innodb-buffer-pool-size=128M",
        "--default-authentication-plugin=mysql_native_password",
      ]
    mem_limit: 512m
    ports:
      - 3306:3306
    volumes:
      - ps-mysql:/var/lib/mysql

  planetscale-proxy:
    image: ghcr.io/mattrobenolt/ps-http-sim:latest
    command:
      [
        "-mysql-no-pass",
        "-listen-port=3900",
        "-mysql-dbname=planetscale",
        "-mysql-addr=ps-mysql",
      ]
    depends_on:
      - ps-mysql
    mem_limit: 128m
    ports:
      - 3900:3900
    links:
      - ps-mysql

  mailhog:
    image: "mailhog/mailhog:latest"
    mem_limit: 64m
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    ports:
      - 6379:6379

  srh:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: "local-dev-token"
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis
    mem_limit: 64m
    ports:
      - 8079:80

volumes:
  ps-mysql:
